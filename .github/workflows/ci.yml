# @typetorch/kernel: everything that can be checked without Roblox. A kernel bug costs a restart of every server, so
# these run before any `typetorch kernel deploy`. Lune and Rojo come from rokit.toml (setup-rokit).
# When smoke-kernel.luau gains a mode, add it to the list below.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lune check, Ed25519 specs, kernel smoke, place build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Rokit tools (rojo, lune)
        uses: CompeyDev/setup-rokit@v0.2.1
        with:
          cache: "true"
      - name: Syntax check (every .luau compiles)
        run: lune run scripts/check.luau
      - name: Ed25519 verifier and Signing specs (RFC 8032 vectors, plans/03 vectors)
        run: lune run scripts/test-ed25519.luau
      - name: Kernel smoke, every server mode
        run: |
          set -euo pipefail
          for mode in "" --fallback --dev --vip --bootstrap --bootstrap-only --blind --empty --studio-local; do
            echo "::group::smoke-kernel ${mode:-(public server)}"
            lune run scripts/smoke-kernel.luau $mode
            echo "::endgroup::"
          done
      - name: The place builds
        run: |
          mkdir -p build
          rojo build place.project.json -o build/place.rbxl
